name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core) + ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check app
      - name: Import app (smoke)
        run: python -c "from app.main import app; print('app ok:', app.title)"
