# Compose Coolify: Ollama (LLM local) + API de inferência, no mesmo stack/rede.
# O serviço `inference` é o único exposto (domínio); o Ollama fica interno.
#
#   docker compose -f docker-compose.coolify.yml up --build
#
name: agenteresolve-inference

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # O host tem 2 vCPU e 12 GB para *tudo* (inferência + 4 workers + RustFS). O LLM
      # local é só o último recurso da cadeia — o caminho rápido é o remoto gratuito.
      # Sem estes limites o Ollama mantém vários modelos residentes (geral + tradução),
      # o host entra em pressão de memória e o container de inferência é reciclado no
      # meio de um job ("Broken pipe" no worker; medido em 2026-10-17).
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=10m
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"

  inference:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - OLLAMA_URL=http://ollama:11434
    # Exposto no host (acessível via tailnet 100.92.240.55:8000 e, se o firewall
    # do Oracle liberar, publicamente). Auth por INFERENCE_KEY.
    ports:
      - "8000:8000"
    expose:
      - "8000"
    depends_on:
      - ollama

volumes:
  ollama-models:
