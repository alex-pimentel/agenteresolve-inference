[project]
name = "agenteresolve-inference"
version = "0.1.0"
description = "API de inferência (LLM gateway + capacidades) do Agenteresolve"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: o FastAPI exige a chamada (`File(...)`, `Form(...)`, `Depends(...)`) no default do
# parâmetro; é o mesmo critério já adotado no repositório agenteresolve-services.
ignore = ["E501", "B008"]
